<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XBetHub Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="./">
                <img src="images/xbethub-logo.png" alt="XBetHub" class="d-inline-block align-text-top">
                XBetHub Admin
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="./">Back to Site</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="admin-dashboard">
            <div class="admin-header">
                <h2 class="mb-0">Admin Dashboard</h2>
            </div>

            <!-- Add New Prediction Form -->
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Add New Prediction</h3>
                </div>
                <div class="card-body">
                    <form id="predictionForm" onsubmit="return false;">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="matchDate" class="form-label">Match Date</label>
                                <input type="date" class="form-control" id="matchDate" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="leagueName" class="form-label">League Name</label>
                                <input type="text" class="form-control" id="leagueName" required placeholder="Premier League">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="leagueFlag" class="form-label">League Flag (Emoji)</label>
                                <input type="text" class="form-control" id="leagueFlag" required placeholder="🏴󠁧󠁢󠁥󠁮󠁿" maxlength="4">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="homeTeam" class="form-label">Home Team</label>
                                <input type="text" class="form-control" id="homeTeam" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="awayTeam" class="form-label">Away Team</label>
                                <input type="text" class="form-control" id="awayTeam" required>
                            </div>
                            <div class="col-md-9 mb-3">
                                <label for="prediction" class="form-label">Prediction</label>
                                <input type="text" class="form-control" id="prediction" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-control" id="status">
                                    <option value="pending">Pending</option>
                                    <option value="win">Win</option>
                                    <option value="loss">Loss</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Prediction</button>
                    </form>
                </div>
            </div>

            <!-- Manage Predictions Table -->
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Manage Predictions</h3>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover admin-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Flag</th>
                                    <th>Home Team</th>
                                    <th>Away Team</th>
                                    <th>Prediction</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-predictions-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="background:#111827; color:#fff; border:1px solid rgba(0,255,102,0.2);">
                <div class="modal-header" style="border-bottom:1px solid rgba(0,255,102,0.2);">
                    <h5 class="modal-title">Edit Prediction</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label">Match Date</label>
                        <input type="date" class="form-control" id="editMatchDate" required>
                    </div>
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label">League Name</label>
                            <input type="text" class="form-control" id="editLeagueName" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">League Flag</label>
                            <input type="text" class="form-control" id="editLeagueFlag" required maxlength="4">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Home Team</label>
                            <input type="text" class="form-control" id="editHomeTeam" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Away Team</label>
                            <input type="text" class="form-control" id="editAwayTeam" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prediction</label>
                        <input type="text" class="form-control" id="editPrediction" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-control" id="editStatus">
                            <option value="pending">Pending</option>
                            <option value="win">Win</option>
                            <option value="loss">Loss</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer" style="border-top:1px solid rgba(0,255,102,0.2);">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function logout() {
            await fetch('api/auth/logout', { method: 'POST', credentials: 'include' });
            window.location.href = 'login';
        }
    </script>
    <script src="js/admin.js"></script>
</body>
</html>
