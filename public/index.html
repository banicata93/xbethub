<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XBetHub – Sports Predictions & Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="./">
            <span class="x">X</span>BetHub
        </a>
        <a class="nav-link" href="login" style="font-size:0.85rem;">Admin ↗</a>
    </nav>

    <!-- Hero / Stats bar -->
    <div class="hero-bar">
        <div>
            <div class="hero-title">Sports Predictions</div>
            <div class="hero-subtitle">Expert tips updated daily</div>
        </div>
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="stat-total">—</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-wins">—</div>
                <div class="stat-label">Wins</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-rate">—</div>
                <div class="stat-label">Win Rate</div>
            </div>
        </div>
    </div>

    <!-- Main layout -->
    <div class="main-layout">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <h3>Partner Sites</h3>
            <ul>
                <li><a href="https://www.goleadortips.com" target="_blank" rel="noopener noreferrer">GoleadorTips</a></li>
                <li><a href="https://www.tennisbettor.net" target="_blank" rel="noopener noreferrer">TennisBettor</a></li>
                <li><a href="https://www.asianhandicapbets.com" target="_blank" rel="noopener noreferrer">AsianHandicapBets</a></li>
            </ul>

            <div class="ad-banner" style="margin-top:1.5rem;">
                <a href="https://www.tennisbettor.net" target="_blank" rel="noopener noreferrer">
                    <div class="ad-banner-overlay"><span>Visit Partner →</span></div>
                    <div class="ad-banner-label">Partner</div>
                    <img src="images/tennisbettor.png" alt="TennisBettor" loading="lazy">
                </a>
            </div>
            <div class="ad-banner">
                <a href="https://www.goleadortips.com" target="_blank" rel="noopener noreferrer">
                    <div class="ad-banner-overlay"><span>Visit Partner →</span></div>
                    <div class="ad-banner-label">Partner</div>
                    <img src="images/goleadorbaner2horizontal.png" alt="GoleadorTips" loading="lazy">
                </a>
            </div>
        </div>

        <!-- Predictions -->
        <div class="content-area">
            <div id="predictions-list"></div>
        </div>

        <!-- Right col banner -->
        <div class="right-col">
            <div class="sticky-banner">
                <a href="https://www.goleadortips.com" target="_blank" rel="noopener noreferrer">
                    <div class="ad-banner-overlay"><span>Visit →</span></div>
                    <img src="images/goleadorbaner2horizontal.png" alt="GoleadorTips" loading="lazy">
                </a>
            </div>
            <div class="sticky-banner">
                <a href="https://www.tennisbettor.net" target="_blank" rel="noopener noreferrer">
                    <div class="ad-banner-overlay"><span>Visit →</span></div>
                    <img src="images/tennisbettor.png" alt="TennisBettor" loading="lazy">
                </a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
